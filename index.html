<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демонстрационная форма</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url('bg.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: Arial, sans-serif;
    }

    .login-form {
        width: 380px;
        max-width: calc(100vw - 32px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 80px;
    }

    .login-form input {
        box-sizing: border-box;
        width: 100%;
        height: 48px;
        padding: 0 16px;
        border: 1px solid #393b3d;
        border-radius: 4px;
        background: #2f3133;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: border-color 0.1s;
    }

    .login-form input::placeholder {
        color: #b8bbbf;
    }

    .login-form input:focus {
        border-color: #666;
    }

    .login-form button {
        height: 48px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #232527;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        margin-top: 4px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .login-form button:hover {
        background: #32353a;
    }
</style>
</head>

<body>
<form class="login-form" onsubmit="return false;">
    <input type="text" placeholder="Логин" aria-label="Логин" autocomplete="off">
    <input type="password" placeholder="Пароль" aria-label="Пароль" autocomplete="new-password">
    <button type="button">Авторизоваться</button>
</form>
</body>
</html>
