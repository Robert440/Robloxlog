<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демонстрационная форма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="login-form" autocomplete="off" onsubmit="return false;">
        <input
            type="text"
            placeholder="Логин"
            aria-label="Логин"
            autocomplete="off"
        >
        <input
            type="password"
            placeholder="Пароль"
            aria-label="Пароль"
            autocomplete="new-password"
        >
        <button type="button">Авторизоваться</button>
    </form>
</body>
</html>
