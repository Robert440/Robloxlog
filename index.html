<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Демонстрационная форма интерфейса. Введённые данные не отправляются и не сохраняются.">
    <title>Демонстрационная форма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="login-form" autocomplete="off" onsubmit="return false;">
        <input
            type="text"
            placeholder="Имя пользователя"
            aria-label="Имя пользователя"
            autocomplete="off"
        >
        <input
            type="password"
            placeholder="Пароль для демонстрации"
            aria-label="Пароль для демонстрации"
            autocomplete="new-password"
        >
        <button type="button">Проверить макет</button>
    </form>
</body>
</html>
