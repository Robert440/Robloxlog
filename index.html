<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в Roblox">
    <title>Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Войти в Roblox</h1>

        <div class="demo-fields">
            <input
                class="demo-input"
                type="text"
                placeholder="Имя пользователя/Электронная почта/Телефон"
                aria-label="Имя пользователя, электронная почта или телефон"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >
            <input
                class="demo-input"
                type="password"
                placeholder="Пароль"
                aria-label="Пароль"
                autocomplete="new-password"
                spellcheck="false"
            >

            <button class="demo-submit" type="button">
                Авторизоваться
            </button>
        </div>

        <p class="demo-help" id="login-status" role="status" aria-live="polite">
            Забыли пароль или имя пользователя?
        </p>

        <hr class="demo-divider">

        <div class="demo-actions">
            <button class="demo-action" type="button">
                Отправить мне одноразовый код по электронной почте
            </button>
            <button class="demo-action" type="button">
                Быстрый вход
            </button>
            <button class="demo-action" type="button">
                Другие варианты входа в систему
            </button>
        </div>

        <div class="demo-footer">
            <span>У вас нет аккаунта?</span>
            <button class="demo-link" type="button">
                Зарегистрируйтесь
            </button>
        </div>
    </main>
</body>
</html>
