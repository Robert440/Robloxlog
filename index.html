<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Твой фон на весь экран -->
    <div class="bg-image"></div>

    <!-- Блок с тремя элементами -->
    <div class="login-box">
        <form id="loginForm" autocomplete="off">
            <input type="text" id="username" placeholder="Имя пользователя/Электронная почта/Телефон" required autocomplete="off">
            <input type="password" id="password" placeholder="Пароль" required autocomplete="new-password">
            <button type="submit" class="login-btn">Авторизоваться</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
